name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: ''
      create_release:
        description: 'Publish GitHub Release with Direct APK Download'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          # Ensure a writable Android SDK root (fallback to $HOME/Android/Sdk if preinstalled path is read-only)
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ] || [ ! -w "$SDK_ROOT" ]; then
            if [ -d "$SDK_ROOT" ] && command -v sudo >/dev/null 2>&1; then
              sudo chown -R "$(id -un):$(id -gn)" "$SDK_ROOT" 2>/dev/null || true
            fi
          fi
          if [ ! -d "$SDK_ROOT" ] || [ ! -w "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/Android/Sdk"
            mkdir -p "$SDK_ROOT"
          fi

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          install_cmdline_tools() {
            local tmp_zip="/tmp/cmdline-tools.zip"
            rm -rf "$tmp_zip" /tmp/cmdline-unpack
            if ! curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" -o "$tmp_zip"; then
              curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$tmp_zip"
            fi
            mkdir -p "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            unzip -q "$tmp_zip" -d /tmp/cmdline-unpack
            mv /tmp/cmdline-unpack/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf "$tmp_zip" /tmp/cmdline-unpack
            chmod +x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          }

          # Only accept modern cmdline-tools sdkmanager (never legacy tools/bin/sdkmanager which breaks on JDK 21)
          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$SDK_ROOT/cmdline-tools" ]; then
            FOUND_SM="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
            if [ -n "$FOUND_SM" ]; then
              chmod +x "$FOUND_SM"
              SDKMANAGER="$FOUND_SM"
            fi
          fi

          if [ -z "$SDKMANAGER" ] || ! "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version >/dev/null 2>&1; then
            install_cmdline_tools
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDKMANAGER (SDK_ROOT=$SDK_ROOT)"

          install_sdk_packages() {
            local rc=0
            set +o pipefail
            (yes 2>/dev/null || true) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || rc=$?
            if [ "$rc" -eq 0 ]; then
              (yes 2>/dev/null || true) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
                "platform-tools" \
                "platforms;android-36" \
                "build-tools;36.0.0" \
                "build-tools;35.0.0" || rc=$?
            fi
            set -o pipefail
            return "$rc"
          }

          # If preinstalled cmdline-tools is too old for android-36, refresh cmdline-tools and retry once
          if ! install_sdk_packages; then
            echo "Preinstalled sdkmanager failed; refreshing cmdline-tools and retrying..."
            install_cmdline_tools
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            install_sdk_packages
          fi

          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -d "$SDK_ROOT/build-tools/36.0.0"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          printf "sdk.dir=%s\n" "$SDK_ROOT" > android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Output
        id: prepare_apk
        run: |
          set -euo pipefail
          mkdir -p release-output
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            APK_SOURCE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1 || true)
          fi
          if [ -z "$APK_SOURCE" ] || [ ! -s "$APK_SOURCE" ]; then
            echo "Error: Debug APK not found or empty!"
            exit 1
          fi
          unzip -tq "$APK_SOURCE" >/dev/null
          cp "$APK_SOURCE" release-output/app-debug.apk
          cp "$APK_SOURCE" release-output/tarjama-wa-taallam-debug.apk
          ls -lh release-output

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarjama-wa-taallam-debug-apk
          path: release-output/*.apk
          retention-days: 30

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.0-build.${{ github.run_number }}"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with Direct APK Download
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release != false && inputs.create_release != 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_title || format('ترجمة وتعلّم - Android Debug APK ({0})', steps.tag_info.outputs.tag_name) }}
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-output/tarjama-wa-taallam-debug.apk
            release-output/app-debug.apk
          body: |
            ### 📱 تطبيق ترجمة وتعلّم (Android Debug APK)

            تم بناء ملف الـ APK تلقائياً عبر GitHub Actions وهو جاهز للتحميل المباشر والتثبيت على أجهزة أندرويد.

            #### 📥 روابط التحميل المباشر (Direct APK Download):
            - **[تحميل مباشر — tarjama-wa-taallam-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag_name }}/tarjama-wa-taallam-debug.apk)**
            - **[تحميل مباشر — app-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag_name }}/app-debug.apk)**
            - **[أحدث إصدار دائماً (Latest APK)](https://github.com/${{ github.repository }}/releases/latest/download/tarjama-wa-taallam-debug.apk)**

            ---
            *Build Run #${{ github.run_number }} • Commit `${{ github.sha }}`*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
